name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing moving major tags after v7 — pin the full version.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      # CLAUDE.md: all green + coverage floor (100%) before any "done" claim.
      # Both operating systems, because filelock.py's two lock branches each
      # carry a `# pragma: no cover` naming the CI that runs the other one. A
      # pragma pointing at a job that does not exist is a claimed check nobody
      # performs — the one thing this project must never ship.
      - run: uv run --extra dev pytest --cov=waxseal
      - run: uv run --extra dev mypy
      - run: uv run --extra dev ruff check .
      # CLAUDE.md: golden vectors are cross-checked by scripts that implement
      # SPEC.md prose directly instead of importing waxseal. A vector suite
      # only ever checked against the code it came from checks nothing.
      # Each exits non-zero on disagreement. gen_vectors.py is deliberately not
      # here: it WRITES, and tests/test_vectors.py already guards that file's
      # frozen hash.
      - run: uv run --extra dev python tools/gen_rfc3161_vectors.py
      - run: uv run --extra dev python tools/gen_consistency_vectors.py
      - run: uv run --extra dev python tools/gen_checkpoint_vectors.py

  # The self-hosted server (docs/plans/waxseal-0.1.5-contract.md, Workstream I).
  # A separate job with its own coverage floor: it is a separate application with
  # its own dependencies, and mixing it into the wheel's gate would let one
  # move the other.
  server:
    runs-on: ubuntu-latest
    # The operator-store contract runs against BOTH adapters. Without a real
    # database the Postgres half skips with a label, which is honest but means
    # nobody ever runs it — so CI provides one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waxseal
          POSTGRES_PASSWORD: waxseal-dev
          POSTGRES_DB: waxseal
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U waxseal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WAXSEAL_TEST_DATABASE_URL: postgresql://waxseal:waxseal-dev@127.0.0.1:55432/waxseal
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      # The load-bearing test in here runs the LIBRARY's own backend-conformance
      # contract against the real server over TCP, using the shipped
      # RemoteBackend unmodified. If that passes, a real waxseal client cannot
      # tell this server apart from the backends waxseal ships with.
      - run: uv sync --extra dev
        working-directory: server
      - run: uv run pytest --cov=waxseal_server
        working-directory: server
      - run: uv run mypy
        working-directory: server

  # The web UI is a build artifact, not a checked-in one: if it stops building,
  # the image stops carrying a UI, and nothing else in CI would notice.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci || npm install
        working-directory: server/web
      - run: npx vue-tsc --noEmit
        working-directory: server/web
      - run: npm run build
        working-directory: server/web
