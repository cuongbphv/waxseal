name: release

on:
  release:
    types: [published]

jobs:
  test:
    name: test (gate before publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-uv stopped publishing moving major tags after v7 — pin the full version.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      # CLAUDE.md: all green + coverage floor (100%) before any release.
      - run: uv run --extra dev pytest --cov=waxseal

  build:
    name: build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # The GitHub-release assets, alongside the PyPI publish rather than instead
  # of it. Three things go up that PyPI does not carry:
  #
  #   * waxseal-<ver>.pyz — the single-file verifier. Possible only because
  #     `dependencies = []` (CLAUDE.md rule 1), and the reason it matters is
  #     that an auditor can carry it into an air-gapped review room with a
  #     python3 and nothing else.
  #   * SHA256SUMS over wheel, sdist and pyz. deploy/install.sh REQUIRES this
  #     file and refuses to install an artifact that is not listed in it, so a
  #     release without it is a release the installer cannot use.
  #   * .sigstore.json bundles. The checksum proves the bytes are the bytes
  #     this release published; only the signature speaks to who published
  #     them. When it is absent the installer says so under a label rather
  #     than passing over it (rule 6).
  #
  # A tool whose whole claim is verifiable integrity has to make its own
  # artifacts verifiable.
  assets:
    name: zipapp + checksums + signatures
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # gh-action-sigstore-python mints its OIDC token from this. `contents:
      # write` is for `gh release upload`.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      # The same wheel and sdist the publish job sends to PyPI, not a second
      # build of them: a SHA256SUMS covering bytes nobody published is a
      # checksum for a different artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: uv run --extra dev python tools/build_pyz.py
      - name: SHA256SUMS
        run: |
          cd dist
          # Basenames only — deploy/install.sh matches on the basename, and a
          # path prefix here would make the file depend on where it was built.
          sha256sum waxseal-*.whl waxseal-*.tar.gz waxseal-*.pyz > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/waxseal-*.whl ./dist/waxseal-*.tar.gz ./dist/waxseal-*.pyz
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/waxseal-*.pyz \
            dist/SHA256SUMS \
            dist/*.sigstore.json \
            --clobber

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name configured in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/waxseal/
    permissions:
      # Mandatory for Trusted Publishing (OIDC) — no API token secret needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
