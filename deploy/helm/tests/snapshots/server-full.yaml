# Source: waxseal-server/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: waxseal-server
  labels:
    helm.sh/chart: waxseal-server-0.1.0
    app.kubernetes.io/name: waxseal-server
    app.kubernetes.io/instance: waxseal-server
    app.kubernetes.io/version: "0.1.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: waxseal
    waxseal.io/trust-domain: chain
spec:
  replicas: 1
  # No headless Service: a single writer has no peers to address by ordinal, so
  # per-pod DNS would be surface with nothing behind it. The ClusterIP Service
  # is named here because the field is required.
  serviceName: waxseal-server
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: waxseal-server
      app.kubernetes.io/instance: waxseal-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waxseal-server
        app.kubernetes.io/instance: waxseal-server
    spec:
      serviceAccountName: waxseal-server
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "ghcr.io/cuongbphv/waxseal-server:0.1.6"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: WAXSEAL_SERVER_DATA_DIR
              value: "/var/lib/waxseal"
            - name: WAXSEAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: waxseal-server-credentials
                  key: WAXSEAL_API_KEY
                  optional: true
            - name: WAXSEAL_WITNESS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: waxseal-server-credentials
                  key: WAXSEAL_WITNESS_API_KEY
                  optional: true
            - name: WAXSEAL_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: waxseal-server-credentials
                  key: WAXSEAL_SERVER_DATABASE_URL
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/waxseal
            # readOnlyRootFilesystem: true, so anything that needs a scratch
            # file needs somewhere to put it.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          helm.sh/chart: waxseal-server-0.1.0
          app.kubernetes.io/name: waxseal-server
          app.kubernetes.io/instance: waxseal-server
          app.kubernetes.io/version: "0.1.6"
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/part-of: waxseal
          waxseal.io/trust-domain: chain
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "fast-ssd"
        resources:
          requests:
            storage: "50Gi"
