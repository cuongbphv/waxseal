apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waxseal-server
  labels:
    helm.sh/chart: waxseal-server-0.1.0
    app.kubernetes.io/name: waxseal-server
    app.kubernetes.io/instance: waxseal-server
    app.kubernetes.io/version: "0.1.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: waxseal
    waxseal.io/trust-domain: chain
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "waxseal.example.invalid"
      secretName: waxseal-tls
  rules:
    - host: "waxseal.example.invalid"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: waxseal-server
                port:
                  name: http
