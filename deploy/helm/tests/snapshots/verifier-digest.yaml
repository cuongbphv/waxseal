apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: waxseal-verifier-pin
  labels:
    helm.sh/chart: waxseal-verifier-0.1.0
    app.kubernetes.io/name: waxseal-verifier
    app.kubernetes.io/instance: waxseal-verifier
    app.kubernetes.io/version: "0.1.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: waxseal
    waxseal.io/trust-domain: verifier
  annotations:
    # Survives `helm uninstall`. Losing the pin loses every head this verifier
    # has ever confirmed, and a fresh pin trusts whatever it is served first.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "64Mi"

