# Fully-configured server: every optional piece on.
#
# Credentials are supplied INLINE here only because a snapshot has to be
# reproducible; a real deployment sets secrets.existingSecret and keeps the
# credential out of the release manifest. The two API keys DIFFER, which the
# chart enforces at render time (templates/validate.yaml) exactly as
# server/scripts/start-docker.sh enforces it at start-up.
image:
  repository: ghcr.io/cuongbphv/waxseal-server
  tag: "0.1.6"
  pullPolicy: IfNotPresent

secrets:
  existingSecret: ""
  apiKey: "snapshot-bootstrap-key-not-a-real-credential"
  witnessApiKey: "snapshot-witness-key-not-a-real-credential"
  databaseUrl: "postgresql://waxseal@postgres.waxseal-chain.svc.cluster.local:5432/waxseal"
  declaresDatabaseUrl: false

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 50Gi
  storageClass: fast-ssd
  mountPath: /var/lib/waxseal
  claimName: data

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
  host: waxseal.example.invalid
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: waxseal-tls

seed:
  enabled: true
  email: audit@example.invalid
  backoffLimit: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# The anchor CLIENT beside the chain, publishing to SINKS under other
# authorities. The client's location is the intended topology; the sinks'
# location is the security argument.
anchor:
  enabled: true
  image:
    repository: ghcr.io/cuongbphv/waxseal
    tag: "0.1.6"
    pullPolicy: IfNotPresent
  schedule: "23 * * * *"
  trailPath: /var/lib/waxseal/chains/default/trail.jsonl
  tsaUrl: https://tsa.example.invalid/tsr
  otsCalendar: https://calendar.example.invalid
  witnessUrls:
    - https://witness.other-authority.example.invalid/v1/witness/waxseal
  existingSecret: waxseal-anchor-credentials
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

networkPolicy:
  enabled: true
  allowIngressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
