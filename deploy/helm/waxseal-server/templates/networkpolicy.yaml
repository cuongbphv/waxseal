{{- if .Values.networkPolicy.enabled }}
{{- /*
Ingress only. Egress is left alone on purpose: the server needs PostgreSQL, and
the anchor client in this same namespace needs whatever TSA, calendar or
witness it was pointed at. A policy that silently broke anchoring would remove
a detection rather than add one, and the removal would be invisible — the chain
would keep verifying `ok` while the published-root defence quietly stopped
existing (domain/archive.py makes the same point about an archive nothing
verifies).
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "waxseal-server.fullname" . }}
  labels:
    {{- include "waxseal-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "waxseal-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
      {{- with .Values.networkPolicy.allowIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
