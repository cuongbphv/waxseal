{{- if include "waxseal-server.rendersOwnSecret" . }}
{{- /*
Rendered ONLY from inline values, which is a development shape: what is here
lands in the release manifest stored in the cluster. In a real deployment set
secrets.existingSecret and keep the credential out of Helm's hands entirely.

Keys absent from .Values are absent from the Secret rather than present and
empty. An empty WAXSEAL_API_KEY is not the same claim as an unset one: unset is
the server's labelled "open" state (GET /v1/meta reports write_auth: open),
and a present-but-empty bearer token is a credential nobody can use wearing the
look of one somebody configured.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-credentials" (include "waxseal-server.fullname" .) }}
  labels:
    {{- include "waxseal-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.apiKey }}
  WAXSEAL_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.witnessApiKey }}
  WAXSEAL_WITNESS_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.databaseUrl }}
  WAXSEAL_SERVER_DATABASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
