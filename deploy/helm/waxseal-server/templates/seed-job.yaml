{{- if and .Values.seed.enabled (include "waxseal-server.hasDatabase" .) }}
{{- /*
`waxseal-server-admin seed` — idempotent, so a hook may re-run it on every
upgrade (server/docs/deployment.md: "seed creates two accounts and is
idempotent, so a deploy script may re-run it").

SEEDING IS WHAT SECURES A DEPLOYMENT. A server with no WAXSEAL_API_KEY and no
minted key is OPEN; the moment the first key exists it stops being open, and
there is no separate "turn auth on" switch to forget.

Rendered only when a database is configured. The Job runs in its OWN pod: with
no WAXSEAL_SERVER_DATABASE_URL the admin CLI writes operators into that pod's
in-memory store and discards them on exit. A hook that succeeds while having
seeded nothing the server can read is a false-confidence report, so it is not
rendered at all and NOTES.txt names the reason.

This Job mounts NO volume: operators and API keys live in PostgreSQL, the
trails live on the data volume, and the seed touches only the former. Mounting
the ReadWriteOnce trail volume here would also be a second pod contending for
it.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-seed" (include "waxseal-server.fullname" .) }}
  labels:
    {{- include "waxseal-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.seed.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "waxseal-server.selectorLabels" . | nindent 8 }}
        waxseal.io/job: seed
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "waxseal-server.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - waxseal-server-admin
            - seed
            {{- with .Values.seed.email }}
            - --email
            - {{ . | quote }}
            {{- end }}
          env:
            - name: WAXSEAL_SERVER_DATA_DIR
              value: /tmp
            {{- include "waxseal-server.credentialEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.seed.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
