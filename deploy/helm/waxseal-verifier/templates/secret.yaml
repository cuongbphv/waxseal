{{- if and .Values.credentials.apiKey (not .Values.credentials.existingSecret) }}
{{- /*
The verifier's OWN credential, and it is not the server's.

WAXSEAL_API_KEY is the variable name the CLI reads for a URL target
(log.py, AuditLog.open). The name is shared with the chain server's bootstrap
credential; the VALUE must be a viewer or auditor key minted for this
namespace. Handing a verifier the chain's write key would put a writer and its
auditor behind one credential — and the whole reason scheduled verification
detects anything is that the verifier is not the writer.

Inline is a development shape: this lands in the stored release manifest.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-credentials" (include "waxseal-verifier.fullname" .) }}
  labels:
    {{- include "waxseal-verifier.labels" . | nindent 4 }}
type: Opaque
stringData:
  WAXSEAL_API_KEY: {{ .Values.credentials.apiKey | quote }}
{{- end }}
