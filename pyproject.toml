[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waxseal"
version = "0.1.4"
description = "Tamper-evident, schema-evolution-safe audit hash chain for AI agent frameworks. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bui Phan Viet Cuong" }]
keywords = ["audit", "hash-chain", "tamper-evident", "ai-agents", "integrity", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Zero hard runtime dependencies — stdlib only. This is a CLAUDE.md invariant.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
    # Integration tests only (TestRealPostgres); runtime deps stay [].
    "psycopg[binary]>=3.1",
    # The `rfc3161` extra's own dependency, needed here so the test suite can
    # MINT a self-signed TSA vector and exercise the valid/invalid branches.
    # Runtime deps stay [].
    "cryptography>=40",
]
# S3Backend/SQLiteBackend/PostgresBackend take an INJECTED client — waxseal
# itself never imports boto3/psycopg (CLAUDE.md rule 1: dependencies = []).
# These extras exist only so `pip install waxseal[s3]` pulls in a compatible
# client for callers who want one, not because waxseal needs it.
s3 = [
    # The floor is verified against boto3's own CHANGELOG.rst, and covers both
    # surfaces adapters/s3.py touches:
    #   1.35.2  "Add support for conditional writes for PutObject and
    #            CompleteMultipartUpload APIs."          -> put_object(IfNoneMatch=)
    #   1.35.69 "Add support for ETag based conditional writes in PutObject and
    #            CompleteMultiPartUpload APIs ..."       -> put_object(IfMatch=)
    # Object Lock (ObjectLockMode / ObjectLockRetainUntilDate /
    # ObjectLockLegalHoldStatus on put_object, plus get_object_lock_configuration
    # and get_object_retention) predates both by six years and does not bind the
    # floor: it is present in the shipped S3 model as far back as botocore
    # 1.12.55 (2018). So IfMatch is the binding constraint and >=1.35.69 covers
    # everything. Corroborated against the shipped model, not just the prose:
    # botocore 1.35.68's PutObjectRequest has no IfMatch member and 1.35.69's
    # does, and boto3 1.35.69 requires botocore>=1.35.69,<1.36.0.
    "boto3>=1.35.69",
]
postgres = [
    "psycopg[binary]>=3.1",
]
# The on-chain ledger layer (adapters/evm.py). DELIBERATELY EMPTY, and that is
# the design rather than an omission: the read path is `eth_call` over the same
# stdlib Transport adapters/remote.py already ships, and the write path hands a
# transaction field dict to a `Signer` the operator constructs and injects
# (ports/ledger.py). There is no client for pip to fetch, so there is nothing
# to list. The extra exists so `pip install waxseal[evm]` is a valid thing to
# type and so the capability has a name in the metadata; it never becomes a
# route by which a crypto library reaches the core (CLAUDE.md rule 1 —
# `dependencies` stays []). An operator who wants `eth-account` or Foundry's
# `cast wallet` behind that Signer installs it themselves.
evm = []
# Optional CMS/X.509 verification of an RFC 3161 token (adapters/rfc3161_verify.py).
# The structural check in domain/rfc3161.py stays dependency-free and unchanged;
# this extra only adds the signature dimension, and only when the operator names
# a CA bundle with --tsa-ca-file. The floor is verified against cryptography's own
# changelog: Certificate.verify_directly_issued_by() landed in 40.0.0 and
# load_pem_x509_certificates() in 39.0.0, so >=40 covers both.
rfc3161 = [
    "cryptography>=40",
]

[project.scripts]
waxseal = "waxseal.cli:main"

[project.urls]
Homepage = "https://github.com/cuongbphv/waxseal"

[tool.hatch.build.targets.wheel]
packages = ["src/waxseal"]

# hatchling's sdist default is "everything git does not ignore", which is the
# right default right up until internal working files get committed. The beads
# issue database alone is 13 MB and has no business in a release artifact, and
# 0.1.3's sdist was 523 KB against the 6.5 MB this would otherwise have shipped.
# The GIFs are build output of tools/gen_workflow_animation.py and the READMEs
# reference them by absolute URL, so an sdist does not need a copy.
[tool.hatch.build.targets.sdist]
exclude = [
  ".beads",
  ".claude",
  "tools/pm",
  "docs/assets",
  # server/ is a separate application with its own dependencies and its own
  # release story (a Docker image), the same standing contracts/ has. A library
  # consumer downloading the waxseal sdist has no use for a FastAPI app and a
  # Vue project, and every byte of it would be dead weight in the tarball.
  "server",
  # contracts/ is the on-chain layer: Solidity sources, a Foundry toolchain and
  # 21 generated cross-vector files. The line above had NAMED it since 0.1.5
  # while the list did not exclude it, which was harmless only for as long as
  # the directory did not exist. It does now, and it was landing 69 files in
  # the sdist of a pure-Python library.
  "contracts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOT "-q" (waxseal-fg4.28). pytest's TerminalReporter.summary_stats opens with
# `if self.verbosity < -1: return`, so the "N failed, M passed" line is dropped
# entirely at -qq and printed undecorated at -q. `addopts` is applied on top of
# whatever the caller types, so a single `-q` on the command line — the most
# natural thing to type — landed the run at -2 and the output ended at the
# FAILED list with no count at all. Reading the verdict from the junit XML is
# still the rule; this only removes the trap for anyone who has not learned it.
# -ra costs one flag and makes the skip reasons visible for the same reason.
addopts = "-ra"

[tool.coverage.run]
source = ["waxseal"]
branch = true

[tool.coverage.report]
# CLAUDE.md invariant: the floor is a ratchet — it may go up, never down.
# 0.1.3 closed the last gaps; the two platform-conditional branches that no
# single OS can reach carry a labelled pragma naming the CI that runs them.
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",           # Protocol method bodies
    # A Protocol body is a type declaration, not code: its methods are never
    # called, and their docstrings leave a partial-branch arc that no test can
    # close. tests/architecture/test_ports.py checks the shape instead.
    "class .*\\(Protocol\\):",
    "if TYPE_CHECKING:",
]

[tool.mypy]
strict = true
# `files` stays scoped to the shipped library, not the test tree: a bare
# `mypy` (no path argument) must stay a fast, src-only --strict gate,
# unaffected by anything below. tests/ is checked by naming it explicitly
# (`mypy tests/`, its own CI/verification step) — mypy always type-checks
# whatever path is given on the command line regardless of `files`, so
# tests/ is fully covered by that second invocation without widening this
# list. See the tests.* override below for what "covered" means there.
files = ["src/waxseal"]

# Host frameworks are imported only inside their own environments and are
# never runtime dependencies (CLAUDE.md rule 1) — no stubs exist to install.
[[tool.mypy.overrides]]
module = ["agents.*", "langchain_core.*", "crewai.*", "hermes_cli.*"]
ignore_missing_imports = true

# boto3 lives in the `s3` extra, never in `dependencies` (CLAUDE.md rule 1), so
# it is legitimately absent on a correct install and ships no stubs. The single
# import is inside `adapters/s3.py::_resolve_client`, guarded, and its
# ImportError is a reported WORM state (`worm_unknown`), not a crash.
[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true

# cryptography lives in the `rfc3161` extra, never in `dependencies` (CLAUDE.md
# rule 1), so it is legitimately absent on a correct install. It DOES ship its
# own types, so this override exists only for the absent-on-this-machine case;
# the imports are inside `adapters/rfc3161_verify.py::_verify`, guarded,
# and their ImportError is a reported `signature_unchecked` state, not a crash.
[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

# The hook classes MUST subclass the host's (untyped) base classes and use
# the host's (untyped) decorators — that is the integration contract itself.
[[tool.mypy.overrides]]
module = "waxseal.integrations.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false

# waxseal-fg4.35: tests/ is checked under mypy, and this is the answer to
# "under what strictness" — not a guess, a measurement. The owner's working
# hypothesis was a RELAXED profile (disallow_untyped_defs kept, warn_return_any
# dropped, was the specific proposal, "given fixtures and parametrize"). The
# actual first full run (`mypy tests/` fresh on this worktree, 01/09/2026,
# superseding an earlier agent's stale ~485-error estimate) measured 508
# errors across 66 of the tree's 129 files, by code: no-untyped-def 226,
# type-arg 101, arg-type 39, no-untyped-call 38, attr-defined 30,
# no-any-return 24, union-attr 19, unused-ignore 11, operator 7, misc 3,
# var-annotated 2, index 2, func-returns-value 2, exit-return 1,
# comparison-overlap 1, call-overload 1, assignment 1 — worked directory by
# directory (tests/domain, tests/adapters, tests/, tests/integrations;
# tests/architecture and tests/ports were already clean). Every single one
# resolved with a real annotation, a `cast()`/narrowing assert, or a
# line-scoped `# type: ignore[<code>]` / `# noqa: B010` naming the exact
# reason (a fake host-SDK module built from `types.ModuleType` for setattr,
# mostly) — not one needed a --strict flag turned off. So the flags below
# are not a relaxation: they are the same ones `strict = true` already sets,
# spelled out here so that fact is PINNED and visible rather than inferred
# from this block's absence — the next person to hit a tests/ mypy error
# should find a deliberate "yes, still --strict" here, not wonder whether
# tests/ was ever actually checked. If a real relaxation is ever needed
# (warn_return_any is the most likely candidate — fixtures/parametrize/
# monkeypatch return values can legitimately be Any in ways a `: T = ...`
# local can't always narrow), change the value here, not the comment.
#
# tests/adapters/test_evm_anvil.py once carried one attr-defined error here
# (Checkpoint imported from the waxseal.domain.bond re-export instead of
# waxseal.domain.checkpoint — the same shape already fixed in test_evm.py),
# left for another agent mid-sweep since it owned that file investigating an
# unrelated flake. Fixed once that agent's own work landed; `mypy tests/`
# reads clean with no exceptions.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
# tools/pm is vendored: it carries its own "beads-pm-kit v0.1.0" header and is
# rewritten whenever that skill is reinstalled. Linting it would either fail CI
# on code this project does not own, or be undone by the next install. It is
# excluded from the sdist for the same reason.
extend-exclude = ["tools/pm"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
