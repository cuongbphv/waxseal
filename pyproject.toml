[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waxseal"
version = "0.1.4"
description = "Tamper-evident, schema-evolution-safe audit hash chain for AI agent frameworks. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bui Phan Viet Cuong" }]
keywords = ["audit", "hash-chain", "tamper-evident", "ai-agents", "integrity", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Zero hard runtime dependencies — stdlib only. This is a CLAUDE.md invariant.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
    # Integration tests only (TestRealPostgres); runtime deps stay [].
    "psycopg[binary]>=3.1",
    # The `rfc3161` extra's own dependency, needed here so the test suite can
    # MINT a self-signed TSA vector and exercise the valid/invalid branches.
    # Runtime deps stay [].
    "cryptography>=40",
]
# S3Backend/SQLiteBackend/PostgresBackend take an INJECTED client — waxseal
# itself never imports boto3/psycopg (CLAUDE.md rule 1: dependencies = []).
# These extras exist only so `pip install waxseal[s3]` pulls in a compatible
# client for callers who want one, not because waxseal needs it.
s3 = [
    # [Unverified] minimum version for IfNoneMatch/IfMatch (S3 conditional
    # writes, AWS GA 2024) is not pinned here — not independently confirmed
    # against boto3's own changelog. If put_object rejects IfNoneMatch as an
    # unexpected keyword, upgrade boto3/botocore to a current release.
    "boto3",
]
postgres = [
    "psycopg[binary]>=3.1",
]
# Optional CMS/X.509 verification of an RFC 3161 token (adapters/rfc3161_verify.py).
# The structural check in domain/rfc3161.py stays dependency-free and unchanged;
# this extra only adds the signature dimension, and only when the operator names
# a CA bundle with --tsa-ca-file. The floor is verified against cryptography's own
# changelog: Certificate.verify_directly_issued_by() landed in 40.0.0 and
# load_pem_x509_certificates() in 39.0.0, so >=40 covers both.
rfc3161 = [
    "cryptography>=40",
]

[project.scripts]
waxseal = "waxseal.cli:main"

[project.urls]
Homepage = "https://github.com/cuongbphv/waxseal"

[tool.hatch.build.targets.wheel]
packages = ["src/waxseal"]

# hatchling's sdist default is "everything git does not ignore", which is the
# right default right up until internal working files get committed. The beads
# issue database alone is 13 MB and has no business in a release artifact, and
# 0.1.3's sdist was 523 KB against the 6.5 MB this would otherwise have shipped.
# The GIFs are build output of tools/gen_workflow_animation.py and the READMEs
# reference them by absolute URL, so an sdist does not need a copy.
[tool.hatch.build.targets.sdist]
exclude = [
  ".beads",
  ".claude",
  "tools/pm",
  "docs/assets",
  # server/ is a separate application with its own dependencies and its own
  # release story (a Docker image), the same standing contracts/ has. A library
  # consumer downloading the waxseal sdist has no use for a FastAPI app and a
  # Vue project, and every byte of it would be dead weight in the tarball.
  "server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["waxseal"]
branch = true

[tool.coverage.report]
# CLAUDE.md invariant: the floor is a ratchet — it may go up, never down.
# 0.1.3 closed the last gaps; the two platform-conditional branches that no
# single OS can reach carry a labelled pragma naming the CI that runs them.
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",           # Protocol method bodies
    # A Protocol body is a type declaration, not code: its methods are never
    # called, and their docstrings leave a partial-branch arc that no test can
    # close. tests/architecture/test_ports.py checks the shape instead.
    "class .*\\(Protocol\\):",
    "if TYPE_CHECKING:",
]

[tool.mypy]
strict = true
files = ["src/waxseal"]

# Host frameworks are imported only inside their own environments and are
# never runtime dependencies (CLAUDE.md rule 1) — no stubs exist to install.
[[tool.mypy.overrides]]
module = ["agents.*", "langchain_core.*", "crewai.*", "hermes_cli.*"]
ignore_missing_imports = true

# boto3 lives in the `s3` extra, never in `dependencies` (CLAUDE.md rule 1), so
# it is legitimately absent on a correct install and ships no stubs. The single
# import is inside `adapters/s3.py::_resolve_client`, guarded, and its
# ImportError is a reported WORM state (`worm_unknown`), not a crash.
[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true

# cryptography lives in the `rfc3161` extra, never in `dependencies` (CLAUDE.md
# rule 1), so it is legitimately absent on a correct install. It DOES ship its
# own types, so this override exists only for the absent-on-this-machine case;
# the imports are inside `adapters/rfc3161_verify.py::_load_backend`, guarded,
# and their ImportError is a reported `signature_unchecked` state, not a crash.
[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

# The hook classes MUST subclass the host's (untyped) base classes and use
# the host's (untyped) decorators — that is the integration contract itself.
[[tool.mypy.overrides]]
module = "waxseal.integrations.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.ruff]
# tools/pm is vendored: it carries its own "beads-pm-kit v0.1.0" header and is
# rewritten whenever that skill is reinstalled. Linting it would either fail CI
# on code this project does not own, or be undone by the next install. It is
# excluded from the sdist for the same reason.
extend-exclude = ["tools/pm"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
